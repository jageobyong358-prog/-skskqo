<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시의 한 생애</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 서류철처럼 쌓인 한 사람의 기록 — 왼쪽 신상 카드, 오른쪽 연대기, 아래 행동 패널 */
:root {
  --bg: #121318;
  --panel: #1b1d24;
  --panel-2: #23262f;
  --line: #34374250;
  --line-strong: #3b3f4b;
  --fg: #ddd7c8;
  --muted: #8f8b80;
  --brass: #c9a14a;
  --brass-dim: #7d6634;
  --blood: #b2443a;
  --mind: #5a9a94;
  --good: #8db36a;
  --display: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --serif: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background-image:
    radial-gradient(1200px 500px at 80% -10%, #c9a14a12, transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 3px, #ffffff03 3px 4px);
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line-strong); padding-bottom: 10px; }
.brand { font-family: var(--display); font-size: clamp(26px, 5vw, 38px); letter-spacing: 0.02em; line-height: 1.1; color: var(--fg); }
.brand small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; color: var(--brass); text-transform: uppercase; margin-bottom: 4px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { background: var(--panel-2); border: 1px solid var(--line-strong); padding: 8px 14px; border-radius: 3px; cursor: pointer; transition: border-color .15s, background .15s; text-align: left; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.primary { background: var(--brass); color: #17140c; border-color: var(--brass); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #d8b25c; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #b2443a80; }

/* 시작 화면 */
.intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.intro .card { padding: 22px; }
.intro h2 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0 0 8px; text-wrap: balance; }
.intro p { font-family: var(--serif); margin: 0 0 12px; color: var(--fg); max-width: 60ch; }
.field { display: grid; gap: 6px; margin: 16px 0; }
.field label { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.field-row { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line-strong); padding: 10px 12px; border-radius: 3px; font-size: 17px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line-strong); padding: 8px 14px; border-radius: 3px; cursor: pointer; font-size: 15px; letter-spacing: 0; color: var(--fg); }
.seg input { accent-color: var(--brass); margin: 0; }
.seg label:has(input:checked) { border-color: var(--brass); color: var(--brass); }
.graves { display: grid; gap: 8px; }
.grave { border-left: 2px solid var(--brass-dim); padding: 4px 0 4px 12px; }
.grave b { font-family: var(--serif); }
.grave span { display: block; font-size: 13px; color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 4px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); }

/* 게임 화면 */
.game { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
.sheet { padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.who h2 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 2px 0 0; line-height: 1.15; }
.who .meta { color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.money { font-family: var(--mono); color: var(--brass); }
.bar { display: grid; gap: 4px; }
.bar-head { display: flex; justify-content: space-between; font-size: 13px; }
.bar-head span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bar-track { height: 7px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 1px; overflow: hidden; }
.bar-fill { height: 100%; transition: width .4s ease; }
.virtues { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.virtue { background: var(--bg); border: 1px solid var(--line-strong); padding: 8px 10px; border-radius: 3px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
.virtue .name { font-size: 13px; color: var(--muted); }
.virtue .rank { font-family: var(--display); font-size: 20px; color: var(--brass); line-height: 1; }
.virtue .num { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--brass-dim); color: var(--brass); padding: 2px 8px; border-radius: 2px; }
.chip.warn { border-color: #b2443a90; color: #e07a6f; }

.main { display: grid; gap: 18px; min-width: 0; }
.panel { padding: 16px 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 20px; }
.ap { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.ap b { color: var(--brass); }
.groups { display: grid; gap: 14px; }
.mang { margin-bottom: 14px; }
.combat .fighters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 12px; }
.combat .fighters > div { display: grid; gap: 8px; align-content: start; }
.foe-meta { font-size: 12px; color: var(--muted); }
.modal .clash { background: var(--bg); border: 1px solid var(--line-strong); padding: 8px 12px; margin-bottom: 12px; font-size: 13px; display: grid; gap: 4px; }
.modal .clash p { margin: 0; font-family: var(--sans); white-space: normal; }
.modal .clash p:last-child { color: var(--fg); }
.modal .clash p:not(:last-child) { color: var(--muted); }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.moves .btn small { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
.rings-tag { color: var(--brass); font-size: 16px; letter-spacing: .1em; }
.kv dd.teach { font-size: 12px; }
@media (max-width: 520px) { .combat .fighters { grid-template-columns: minmax(0, 1fr); } }
.turn .scene { font-family: var(--serif); margin: 0 0 14px; }
.turn .last { margin: 0 0 12px; padding: 10px 12px; background: var(--bg); border-left: 2px solid var(--brass-dim); color: #bdb7a8; font-size: 14px; white-space: pre-line; }
.turn .choices .btn { padding: 12px 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
.tools .btn small { display: block; color: var(--muted); font-size: 12px; }
.rings { display: flex; flex-wrap: wrap; gap: 6px; }
.ring { display: grid; gap: 2px; padding: 6px 12px; color: var(--brass); letter-spacing: .1em; }
.ring small { color: var(--muted); font-size: 11px; letter-spacing: 0; }
.ring.on { border-color: var(--brass); background: #c9a14a1f; }
.group-title { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin-bottom: 6px; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.act { display: grid; gap: 2px; padding: 10px 12px; }
.act b { font-weight: 500; }
.act small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.advance { width: 100%; text-align: center; padding: 14px; font-size: 17px; margin-top: 14px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; }

.log { padding: 6px 18px 18px; max-height: 560px; overflow-y: auto; }
.year { padding: 14px 0; border-bottom: 1px dashed var(--line-strong); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
.year:last-child { border-bottom: 0; }
.year .age { font-family: var(--display); font-size: 22px; color: var(--brass); line-height: 1.2; }
.year .age small { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.entries { display: grid; gap: 6px; font-family: var(--serif); font-size: 15px; }
.entries p { margin: 0; max-width: 68ch; }
.entries .k-event { color: var(--fg); }
.entries .k-event b { color: var(--brass); font-family: var(--sans); font-size: 13px; margin-right: 6px; }
.entries .k-act { color: #bdb7a8; }
.entries .k-good { color: var(--good); }
.entries .k-bad { color: #e07a6f; }
.entries .k-death { color: var(--blood); font-weight: 700; }

/* 모달 */
.modal-back { position: fixed; inset: 0; background: #07080bcc; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.modal { width: min(560px, 100%); padding: 22px; border-top: 3px solid var(--brass); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 4px 0 10px; text-wrap: balance; }
.modal p { font-family: var(--serif); margin: 0 0 16px; white-space: pre-line; }
.choices { display: grid; gap: 8px; }
.choices .btn small { display: block; color: var(--muted); font-size: 12px; }

/* 엔딩 */
.ending { padding: 26px; display: grid; gap: 14px; border-top: 3px solid var(--blood); }
.ending h2 { font-family: var(--display); font-weight: 700; font-size: 34px; margin: 0; }
.epitaph { font-family: var(--serif); font-size: 18px; border-left: 2px solid var(--brass); padding-left: 14px; max-width: 60ch; }

.foot { color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 820px) {
  .game, .intro { grid-template-columns: minmax(0, 1fr); }
  .sheet { position: static; }
  .log { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>The City · Life Record</small>도시의 한 생애</div>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div id="screen"></div>
  <p class="foot">Project Moon 세계관(로보토미 코퍼레이션 · 라이브러리 오브 루이나 · 림버스 컴퍼니)을 바탕으로 한 비공식 팬 게임입니다.</p>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
// ───────── 유틸 ─────────
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = sel => document.querySelector(sel);

const SAVE_KEY = "cityLife.save.v1";
const GRAVE_KEY = "cityLife.graves.v1";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ───────── 세계 데이터 ─────────
const VIRTUES = [["fort", "용기"], ["prud", "신중"], ["temp", "자제"], ["just", "정의"]];
const GENDERS = { m: "남성", f: "여성" };
const ZONES = { nest: "둥지", back: "뒷골목", out: "외곽", wing: "날개 구역", spider: "거미집", hcorp: "H사 구역", sisyphe: "시지프 백화점" };
// 시지프 백화점: N사의 금기를 어겨 시지프형을 받은 사람이 들어가는 곳. 층을 오르다 지면 지하 1층으로 굴러떨어진다.
const FLOORS = ["지하 1층 푸드코트", "1층 잡화관", "2층 의류관", "3층 가전관", "4층 상영관", "옥상"];
const FLOOR_FOES = ["푸드코트 점원", "잡화관 매니저", "의류관 마네킹들", "가전관 보안 요원", "상영관 안내원"];
const isN = () => (s.job?.type === "wing" && s.job.co === "N사") || (s.zone === "wing" && s.wingCo === "N사");
const nestLike = st => st.zone === "nest" || st.zone === "wing";
const streetLike = st => st.zone === "back" || st.zone === "out";
// 거미집의 아비들. 시오미 요루(소지)는 탈출 전까지 거미집에 남아 있다.
const ABI = {
  "뤼엔": { finger: "검지", str: 170, mang: 3, loot: ["남겨진 신탁", "계속 울리는 단말기"], desc: "검은 양복에 가면을 쓴 검지의 신탁 대행자. 거미집의 판을 짠 사람이고, 모든 것을 지령의 이름으로 행한다." },
  "발렌치나": { finger: "엄지", full: "발렌치나 보냐텔리", str: 130, mang: 1, loot: ["오딘의 눈", "레이피어"], line: "씨발, 어디 싸돌아다니다 이제 기어 나왔어, 이 배은망덕한 새끼야? 키워 준 은혜도 모르고 좆같이 도망을 쳐? 이리 와, 오늘 다리몽둥이 부러질 줄 알아.", desc: "보냐텔리 가문에서 쫓겨난 연기 전쟁의 영웅. 합을 주고받을수록 빨라지는 속검술 팔레르모, 오른눈에 박힌 오딘의 눈." },
  "마티아스": { finger: "중지", str: 160, mang: 0, loot: ["레바테인", "앙갚음 장부 [번외]"], desc: "중지의 큰형님. 봉인 붕대가 한 겹씩 풀릴 때마다 대검 레바테인이 열기를 토한다.", line: "어이, 막내! 식구가 집을 나가면 쓰나. 큰형님이 직접 데리러 왔다!" },
  "칼리스토": { finger: "약지", str: 112, mang: 0, loot: ["티비아", "마에스트로의 반지"], desc: "약지 신체파의 전직 마에스트로. 뼈와 근육을 늘이는 티비아를 휘두르고, 개조 인형들을 부린다.", line: "아아, 여기 계셨군요. 당신은 아직 미완성입니다. 제가 마저 완성해 드리지요." },
  "요루": { finger: "소지", full: "시오미 요루", str: 74, mang: 0, desc: "하얀 시로무쿠 차림의 어머니. 지혜성도가 지나간 자리마다 파란 검흔이 남는다." },
};
const H_FAMILIES = ["청운 가문", "백린 가문", "현무 가문", "금령 가문", "적하 가문"];
const HEISHOU = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
const SHIPS = ["회색 고래", "검은 물보라", "녹슨 닻", "새벽 갈매기", "끝없는 수평선"];
const LAKE_FOES = ["호수 밑에서 올라온 거대한 그림자", "대호수의 식인 어군", "안개 속의 유령선", "촉수 달린 괴어"];
const TABOO_FOES = ["시간을 되감으려는 연구자", "인공지능에 몸을 맡긴 자", "복제인간 공장의 주인", "금기 기술 밀매상"];
const CLAW_TARGETS = ["금기를 어긴 날개의 임원", "특이점을 빼돌린 연구 집단", "금기 연구를 숨긴 특색 해결사"];
const COMMISSION_FOES = ["뒷골목 조직원들", "용병 무리", "도망친 개조인간", "폭주한 의체 사용자", "경쟁 사무소의 해결사"];
const DOG_NAMES = ["보리", "콩이", "까망이", "뭉치"];
const BLOOD_RANKS = ["갓 태어난 혈귀", "혈귀", "오래된 혈귀", "혈귀 귀족"];
const MANSIONS = ["은빛 장미 저택", "둥지 언덕의 아르덴 저택", "금박 담장의 로웰가", "11구의 오래된 저택", "검은 철문 집안"];
const INTRUDERS = ["저택에 숨어든 도둑들", "주인을 노린 자객", "경쟁 가문의 사병들", "뒷골목 조직원들"];
const BLOOD_FOES = ["굶주린 혈귀", "혈귀 무리", "혈귀 가문의 버틀러들", "오래된 혈귀"];
const RUIN_FOES = ["유적의 수호 기계", "무너진 회랑의 괴물", "경쟁 도굴꾼들", "잠에서 깬 무언가"];
// 유물: 위력을 주지만 해마다 대가를 받아 간다
const RELICS = [
  { name: "울부짖는 창", pow: 15, curse: "sp", desc: "휘두를 때마다 누군가의 비명이 들린다." },
  { name: "피를 먹는 검", pow: 18, curse: "hp", desc: "주인의 피도 가리지 않는다." },
  { name: "시간의 모래시계", pow: 6, stat: "prud", curse: "sp", desc: "모래가 거꾸로 흐를 때가 있다." },
  { name: "침묵의 가면", pow: 8, stat: "temp", curse: "sp", desc: "쓰고 있으면 자기 목소리가 들리지 않는다." },
  { name: "녹슨 왕관", pow: 5, rep: 20, curse: "hp", desc: "이마를 조금씩 파고든다." },

// ───────── 수치 변화 ─────────

function serve() {
  const j = s.job;
  const m = rand(1500, 3000) * (j.rank + 1);
  const promote = () => { if (j.rank < 3 && chance(0.3)) { j.rank++; setJob(j); if (j.rank === 3) achieve("butlerChief"); return ` 지금은 ${jobLabel(j)}.`; } return ""; };
  if (chance(0.55)) {
    s.money += m; gain("temp", 2);
    return `${j.house}의 연회를 준비하고 손님들을 배웅했다. 소매 속 칼은 한 번도 꺼내지 않았다. 수고비 ${fmt(m)}안.${promote()}`;
  }
  const foe = pick(INTRUDERS);
  return {
    combat: { name: foe, desc: `${j.house}의 담장을 넘은 자들이 있다. 쟁반을 내려놓고 장갑을 고쳐 꼈다.`, str: 40 + j.rank * 12, yieldAt: 15, cause: `${j.house}을(를) 지키다 ${foe}에게` },
    win() { s.money += m * 2; s.rep += 3; gain("just", 2); return `${foe}을(를) 정리했다. 주인은 차를 마시던 손을 멈추지 않았다. 특별 수당 ${fmt(m * 2)}안.${promote()}`; },
    lose() { s.rep -= 2; return "침입자를 막지 못했다. 주인의 눈길이 차가웠다."; },
  };
}
function ruin() {
  const j = s.job;
  const foe = pick(RUIN_FOES);
  return {
    combat: { name: foe, desc: "무너진 회랑 깊은 곳. 먼지 쌓인 받침대 위에 무언가가 놓여 있다.", str: 45 + j.rank * 12, yieldAt: 15, cause: `유적에서 ${foe}에게` },
    win() {
      const m = rand(2000, 5000) * (j.rank + 1);
      s.money += m; j.exp++;
      let text = `${foe}을(를) 쓰러뜨리고 유적의 잔해를 팔아 ${fmt(m)}안을 벌었다.`;
      const left = RELICS.filter(r => !r.hidden && !(s.relics || []).includes(r.name));
      if (left.length && chance(0.4)) text += " " + gainRelic(pick(left));
      if (j.rank < 3 && j.exp >= (j.rank + 1) * 3) { j.rank++; j.exp = 0; setJob(j); text += ` 지금은 ${jobLabel(j)}.`; }
      return text;
    },
    lose() { return "유적에서 쫓겨났다. 받침대 위의 것은 손에 넣지 못했다."; },
  };
}
function gainRelic(r) {
  (s.relics || (s.relics = [])).push(r.name);
  if (r.stat) gain(r.stat, 10);
  if (r.rep) s.rep += r.rep;
  achieve("relic");
  if (s.relics.length >= 5) achieve("relic5");
  return `유물 「${r.name}」을(를) 손에 넣었다. ${r.desc} (위력 +${r.pow})`;
}
function sellRelic() {
  return {
    title: "유물 경매",
    text: "날개의 수집가와 손가락의 대리인이 같은 줄에 앉아 있다. 무엇을 내놓을까.",
    choices: [
      ...s.relics.map(n => ({ label: `「${n}」`, sub: `위력 -${relicOf(n).pow}`, run() {
        const m = rand(20000, 60000);
        s.relics = s.relics.filter(x => x !== n);
        s.money += m;
        return `「${n}」이(가) ${fmt(m)}안에 낙찰되었다. 손이 가벼워졌다.`;
      } })),
      { label: "내놓지 않는다", run: () => "경매장을 나왔다." },
    ],
  };
}

function quitJob() {
  const j = s.job;
  if (j.type === "claw") { die("발톱의 자리를 떠나려 했다. 머리를 떠난 발톱은 존재하지 않는다"); return ""; }
  if (j.type === "finger") {
    setJob(null);
    hurt(rand(40, 90), `${j.name}을(를) 떠나려다`);
    return s.alive ? `${j.name}을(를) 떠났다. 손가락 하나를 두고 나왔다.` : "";
  }
  const old = jobLabel(j);
  setJob(null);
  return `${old} 일을 그만뒀다.`;
}

const SPIDER_EVENTS = ["self", "egoRampage", "sick"];
const SISYPHE_EVENTS = ["self", "egoRampage", "sick", "broadcast", "peddler", "rainyNight"];
function weighted(list) {
  const ws = list.map(e => Math.max(0, e.w()));
  const total = ws.reduce((a, b) => a + b, 0);
  if (total <= 0) return null;
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

  if (s.zone === "spider") return spiderMilestones(out, m);
  if (s.age === 1) m("첫걸음", nestLike(s) ? "깨끗한 바닥 위에서 첫걸음을 뗐다." : "녹슨 철판 위에서 첫걸음을 뗐다.");
  if (s.zone === "hcorp" && s.age === 6) m("서당", "H사 구역의 서당에 들어갔다. 예법과 글씨, 그리고 윗사람 앞에서 고개를 숙이는 법을 배웠다.", () => { gain("prud", 3); gain("temp", 3); });
  if (s.hFamily && s.age === 16) m("가주 후보", `${s.hFamily}의 원로회가 당신을 가주 후보로 지명했다. 형제들의 눈빛이 그날부터 달라졌다.`, () => { s.heir = { wins: 0 }; achieve("heir"); });

  if (s.age === 18) {

        { label: "작살을 들고 뱃머리에 선다", sub: `체력 ${fmt(wh.hp)} · 위력 ${wh.str} · 처치하면 ${wh.loot}`, run: () => ({

          win(n) { s[wh.flag] = true; s.rep += 100; achieve(wh.ach); return `${n}합 끝에 ${wh.end} ${gainRelic(relicOf(wh.loot))}`; },
          lose() { s.money = Math.floor(s.money * 0.7); return `배가 뒤집혔다. 정신을 차렸을 때는 부서진 갑판 조각에 매달려 있었다. ${wh.name}은(는) 이미 깊이 잠겨 있었다.`; },
          fled() { return "키를 꺾어 안개 속으로 도망쳤다. 등 뒤에서 거대한 숨소리가 오래 따라왔다."; },
        }) },
        { label: "배를 돌린다", run: () => "선원들과 함께 노를 저었다. 거대한 그림자는 쫓아오지 않았다." },
      ],
    }),
  };
}
function abiLoot(name) {
  return (ABI[name].loot || []).filter(n => !(s.relics || []).includes(n)).map(n => gainRelic(relicOf(n))).join(" ");
}
function abiFoe(name, extra = {}) {
  const a = ABI[name];
  return { name: `${a.finger}의 아비 ${a.full || name}`, desc: a.desc, str: a.str, mang: a.mang, easy: teachOf(name) * 4, cause: `${a.finger}의 아비 ${name}에게 패배하여`, ...extra };
}
function spiderMilestones(out, m) {
  if (s.age === 1) m("첫걸음", "실이 늘어진 방바닥을 기어 다니며 첫걸음을 뗐다. 어머니 시오미 요루는 한 번도 안아 주지 않았다.");
  if (s.age === 4) m("다섯 아비", "엄지, 검지, 중지, 약지, 소지. 서로를 혐오하는 다섯 손가락이 이곳에서만은 손을 잡았다. 그들이 보낸 다섯 아비가 너를 기른다. 무엇을 위해서인지는 아직 아무도 말해 주지 않는다.");
  if (s.age >= 5 && s.age <= 22) out.push({ run: abiLesson });
  if (s.age === 12) {
    const dog = pick(DOG_NAMES);
    m("강아지", `어디선가 흘러든 강아지 한 마리가 방에 숨어들었다. ${dog}(이)라고 이름 붙였다. 거미집에서 처음 만난 따뜻한 것이었다.`, () => { s.dog = dog; heal(0, 25); });
  }
  if (s.age === 13) m("아라야시키", "아비들이 검 한 자루를 쥐여 주었다. 벤 것의 존재를 세상에서 지워 버리는 유물, 아라야시키. 휘두를 때마다 쥔 사람의 기억도 함께 지워 간다고 했다. 너는 이 검을 다루기 위해 길러지고 있었다.", () => { s.relic = "아라야시키"; s.memory = 100; });
  if (s.age === 15) m("작별", `${s.dog || "강아지"}가 차갑게 식어 있었다. 전날 어느 아비가 "쓸모없는 것"이라고 중얼거렸던 것이 떠올랐다.`, () => strain(rand(20, 30), "강아지를 잃은 슬픔에"));
  if (s.age === 20) m("아라야", "너의 유전자로 배양한 아이가 태어났다. 이름은 아라야. 아비들은 검의 제어 장치라고 불렀지만, 아이는 너만 보면 해맑게 웃었다. 처음으로 지키고 싶은 것이 생겼다.", () => { s.araya = "spider"; heal(0, 30); });
  if (s.age >= 26) out.push({ run() { die("거미집에 남아 자아를 잃고, 존재를 베어 내는 기계가 되었다"); return null; } });
  else if (s.age >= 23) out.push({ run: escapeEvent });
  return out;
}

// 아비의 가르침은 0~10. 높을수록 그 아비와 싸울 때 상대 위력이 4씩 깎인다.
function abiLesson() {
  const kid = gx("아들", "딸");
  const t = n => `가르침 ${teachOf(n)}/10`;
  const learn = n => {
    const tt = s.spider.teach || (s.spider.teach = {});
    tt[n] = Math.min(10, (tt[n] || 0) + 1);
    return tt[n] === 10 ? " 이 아비에게서 배울 것은 이제 없다." : "";
  };
  return {
    title: "아비의 수업",
    text: "다섯 아비가 번갈아 너를 가르친다. 오늘은 누구의 수업을 받을까. 어느 쪽이든 아플 것이다.\n가르침을 많이 받은 아비일수록, 언젠가 그와 싸울 때 수가 읽힌다.",
    choices: [
      { label: "발렌치나 — 팔레르모 속검술", sub: `정의 ↑↑ · 변덕스러운 손찌검 · ${t("발렌치나")}`, run() {
        const note = learn("발렌치나");
        gain("just", rand(4, 7));
        if (chance(0.5)) {
          bruise(rand(5, 15));
          return s.alive ? `"합을 주고받을수록 검은 빨라지는 거라고. 씨발, 이것도 못 알아처먹어? 대가리는 장식이야?" 그러다 이유 없이 뺨을 맞았다. 수업이 끝나자 술 냄새를 풍기며 머리를 헝클었다. "잘했어, 우리 ${kid}. 거봐, 처맞으니까 좀 낫잖아. 엄마한테 고맙다고 안 해, 이 싸가지 없는 새끼야?"${note}` : "";
        }
        heal(0, 8);
        return `발렌치나가 술병을 내려놓고 박수를 쳤다. "그래, 지랄 맞게 굴더니 그 정도는 해야 내 ${kid}지. 딴 데 가서 내 이름 팔고 다니면 씨발, 모가지 따 버린다?" 오른눈의 오딘의 눈이 너의 다음 동작을 먼저 읽었다.${note}`;
      } },
      { label: "마티아스 — 대검 난타", sub: `용기 ↑↑ · 체력 소모 · ${t("마티아스")}`, run() {
        const note = learn("마티아스");
        gain("fort", rand(5, 8));
        bruise(rand(8, 18));
        return s.alive ? `"식구끼리 봐주는 건 없어! 엄살 그만 떨고 일어나, 한 판 더 하자!" 레바테인의 붕대는 한 겹도 풀리지 않았는데 온몸이 데인 것 같았다.${note}` : "";
      } },
      { label: "칼리스토 — 약지의 예술", sub: `자제·신중 ↑ · 정신 소모 · ${t("칼리스토")}`, run() {
        const note = learn("칼리스토");
        gain("temp", rand(3, 5)); gain("prud", 2);
        if (chance(0.3)) s.aug++;
        strain(rand(10, 16), "칼리스토의 작품 앞에서");
        return s.alive ? `칼리스토가 살아 있는 재료로 만든 작품들 앞에 너를 세웠다. "모든 사조를 하나로 녹여 내는 겁니다. 예술은 고통을 견디는 법부터 배우는 것이지요. 당신은 아주 좋은 재료랍니다."${note}` : "";
      } },
      { label: "시오미 요루 — 지혜성도와 시간", sub: `신중 ↑↑ · 시간 인식 · 폭언 · ${t("요루")}`, cond: () => s.spider.abi.includes("요루"), run() {
        const note = learn("요루");
        gain("prud", rand(4, 7));
        const first = !s.timeSense;
        s.timeSense = true;
        strain(rand(8, 15), "어머니의 폭언에");
        return s.alive ? `요루는 가르치는 내내 너를 보지 않았다. "너만 없었으면." 그래도 검이 지나간 자리에 파란 검흔을 남기는 법은 정확히 보여 주었다.${first ? " 멈춘 시간 속에서도 자신의 시간을 느끼는 감각이 깨어났다." : ""}${note}` : "";
      } },
      { label: "뤼엔 — 동화책", sub: `정신 회복 · 신중 ↑ · ${t("뤼엔")}`, run() {
        const note = learn("뤼엔");
        heal(0, rand(10, 18)); gain("prud", 2);
        return `뤼엔이 무릎 위에 동화책을 펼쳤다. 어느 이야기든 결말은 처음부터 정해져 있었다. "착한 아이는 시키는 대로 하는 법이란다. 그게 지령이니까." 가면 너머의 목소리는 끝까지 다정했다.${note}`;
      } },
    ],
  };
}

function escapeEvent() {
  const vault = s.araya === "spider";
  return {
    title: "거미집의 틈",
    text: `경비가 바뀌는 시간, 실과 실 사이에 틈이 생겼다. 이곳에 남으면 언젠가 존재를 베어 내는 기계가 될 것이다.${vault ? "\n아라야를 데리고 나갈 수는 없다. 금고에 숨겨 두면 아비들도 찾지 못할 것이다." : ""}`,
    choices: [
      { label: vault ? "아라야를 금고에 숨기고 탈출한다" : "거미집을 탈출한다", sub: `${vault ? "\"반드시 돌아올게.\" · " : ""}출구를 지키는 시오미 요루와 전투 · ${`가르침 ${teachOf("요루")}/10`}`, run: () => ({
        combat: abiFoe("요루", { yieldAt: 15, flee: false, desc: "출구 앞을 어머니가 막아섰다. 지혜성도의 날이 파랗게 빛난다." }),
        win: () => escapeDone(vault),
        lose() { return "틈은 함정이었다. 아비들에게 끌려와 며칠을 묶여 지냈다."; },
      }) },
      { label: "아직은 때가 아니다", run() { strain(5); return `실 사이에 몸을 숨기고 한 해를 더 버텼다.${s.age >= 25 ? " 더 버티면 자신이 누구인지 잊을 것 같다." : ""}`; } },
    ],
  };
}
function escapeDone(vault) {
  s.spider.escaped = true;
  s.spider.escapeAge = s.age;
  s.spider.abi = s.spider.abi.filter(n => n !== "요루");
  s.parents = 0;
  if (vault) s.araya = "vault";
  s.zone = "back";
  s.district = rand(1, 25);
  achieve("spiderEscape");
  return `${s.relic ? "아라야시키" : "검"}가 어머니의 혀를 가르고 심장을 꿰뚫었다. 시오미 요루는 끝내 아무 말도 하지 않았다.\n${vault ? "금고 문을 닫으며 아라야에게 약속했다. 반드시 돌아오겠다고. " : ""}${s.district}구 뒷골목의 공기를 처음으로 마셨다.`;
}
const huntable = () => (s.spider?.escaped ? s.spider.abi.filter(n => n !== "뤼엔" && ABI[n]) : []);

function vaultEvent() {
  return {
    title: "금고",
    text: "숨겨 두었던 금고를 열었다. 아라야는 없었다.\n안쪽 벽의 손톱 자국, 말라붙은 얼룩, 그리고 붉은 리본 하나만 남아 있었다.\n복도 저편에서 아비들의 발소리가 다가온다.",
    choices: [{ label: "검을 쥐고 일어선다", sub: "남은 아비들과 차례로 싸운다. 마지막은 뤼엔이다.", run() {
      strain(rand(15, 25), "텅 빈 금고 앞에서");
      if (!s.alive) return "";
      return gauntlet([...huntable(), "가짜 요루", "뤼엔"]);
    } }],
  };
}
// 거미집 귀환: 남은 아비들과 한 명씩 싸우고 마지막에 뤼엔과 싸운다
function gauntlet(list) {
  const [name, ...rest] = list;
  const between = text => {
    say(text, "event", "거미집");
    return { title: "거미집", text, choices: [{ label: rest.length ? "다음 아비에게로" : "끝을 낸다", run: () => (rest.length ? gauntlet(rest) : "") }] };
  };
  if (name === "가짜 요루") return {
    combat: {
      name: "소지의 아비 시오미 요루", mang: 3, str: 112, easy: teachOf("요루") * 4, flee: false,
      desc: "죽였을 터인 시오미 요루가 하얀 시로무쿠 차림으로 서 있다. 지혜성도가 지나간 자리마다 파란 검흔이 남는다. 그녀가 세 겹의 망을 감았다. 얼굴이 어딘가 낯익지만, 떠오르지 않는다.",
      cause: "소지의 아비 시오미 요루의 지혜성도에 베여",
    },
    win() {
      s.araya = "lost";
      strain(rand(10, 20), "이유 모를 슬픔에");
      if (!s.alive) return "";
      const loot = ["지혜성도", "자양화"].filter(n => !(s.relics || []).includes(n)).map(n => gainRelic(relicOf(n))).join(" ");
      return between("요루가 쓰러졌다. 머리에서 풀린 붉은 리본이 바닥에 떨어졌다. 어디선가 본 것 같았지만, 아라야시키가 지워 간 기억 사이로 빠져나갔다. " + loot);
    },
  };
  if (name === "뤼엔") return {
    combat: abiFoe("뤼엔", { flee: false, desc: "검은 양복의 뤼엔이 손뼉을 쳤다. 손목에 세 겹의 망이 감긴다. \"모두 지령대로구나. 동화의 결말처럼.\"" }),
    win() {
      s.spider.abi = s.spider.abi.filter(n => n !== "뤼엔");
      s.spider.done = true;
      s.rep += 30; heal(0, 20);
      achieve("abiSlayer"); achieve("spiderEnd");
      return `뤼엔의 세 겹의 망이 끊어졌다. 쓰러지며 그가 웃었다. "끝까지 알아보지 못하였구나." 무슨 뜻인지 알 수 없었다. 거미집의 실이 하나둘 끊어져 내렸다. ${abiLoot("뤼엔")}`;
    },
  };
  return {
    combat: abiFoe(name, { flee: false }),
    win() {
      s.spider.abi = s.spider.abi.filter(n => n !== name);
      achieve("abiSlayer");
      return between(`${ABI[name].finger}의 아비 ${name}을(를) 베었다. ${abiLoot(name)}`);
    },
  };
}

// ───────── 시지프 백화점 ─────────
function nJudgment() {
  return {
    title: "N사의 심판",
    text: "N사는 영상을 남긴 자도, 경험을 위조한 자도 용서하지 않는다. 규율을 어긴 자에게 내려지는 벌은 하나, 시지프형이다.\n목에 밧줄이 감겼다. 숨이 끊어지기 직전, 세상이 하얗게 뒤집혔다.",
    choices: [{ label: "눈을 뜬다", run: enterSisyphe }],
  };
}
function enterSisyphe() {
  s.nTaboo = false;
  setJob(null);
  s.zone = "sisyphe";
  s.floor = 1;
  VIRTUES.forEach(([k]) => { s[k] = 10; });
  s.hp = 100; s.sp = 70;
  achieve("sisyphe");
  return "눈을 뜨니 백화점 1층이었다. 시지프 백화점. 안내 방송이 흘러나온다.\n\"고객님의 모든 능력은 10으로 조정되었습니다. 형기를 마치실 때까지 즐거운 쇼핑 되십시오.\"\n지하 1층 푸드코트에서는 사람의 경험을 담은 통조림을 판다. 계산은 이곳에서도 안(安)으로 한다.";
}
function climb() {
  const f = s.floor || 0;
  const foe = FLOOR_FOES[f];
  return {
    combat: { name: foe, desc: `${FLOORS[f + 1]}로 가는 에스컬레이터 앞을 ${foe}이(가) 막아섰다. 지면 지하 1층까지 굴러떨어진다.`, str: 20 + f * 14, yieldAt: 20, cause: `${foe}에게 밀려` },
    win() { s.floor = f + 1; return s.floor === 5 ? "마지막 계단을 올랐다. 옥상의 문이 열려 있다." : `${FLOORS[s.floor]}에 올라섰다.`; },
    lose() { s.floor = 0; strain(rand(5, 12), "다시 바닥으로 떨어져"); return s.alive ? "에스컬레이터를 거꾸로 굴러떨어졌다. 다시 지하 1층이다. 돌을 밀어 올리던 누군가처럼." : ""; },
    fled() { return "한 걸음 물러섰다. 에스컬레이터는 계속 올라가고 있다."; },
  };
}
function cannedExperience() {
  s.money -= 500;
  const [k, n] = pick(VIRTUES);
  const g = gain(k, rand(6, 12));
  strain(rand(6, 14), "남의 경험을 삼키고");
  const past = pick(["누군가의 첫 출근", "어느 해결사의 마지막 의뢰", "모르는 사람의 첫사랑", "어떤 아이의 생일"]);
  return s.alive ? `경험 통조림을 땄다. ${past}의 맛이 났다. 그 사람은 지금 어디에 있을까. ${n} +${g}` : "";
}
function cinema() {
  const lines = s.log.flatMap(y => y.e.filter(e => e.k === "event" || e.k === "good").map(e => [y.age, e.t]));
  const [age, text] = lines.length ? pick(lines) : [0, "아무것도 상영되지 않았다."];
  heal(0, 30); gain("prud", 3);
  return `스크린에 ${age}세의 내가 나왔다. "${text}" 영화가 끝날 때까지 아무도 일어나지 않았다.`;
}
function leaveSisyphe() {
  s.zone = "back";
  s.district = rand(1, 25);
  s.floor = null;
  achieve("sisypheOut");
  heal(30, 30);
  return `옥상 문을 열자 도시의 하늘이 보였다. 형기가 끝났다. ${s.district}구 뒷골목의 녹슨 공기 속으로 다시 걸어 나왔다.`;
}

// ───────── 한 해 보내기 ─────────
function passive() {
  const j = s.job;
  let income = 0;
  if (j?.type === "wing") income = 9000 + j.rank * 5000 + s.prud * 40;
  else if (j?.type === "worker") income = 1600 + s.temp * 20;
  else if (j?.type === "synd") income = 800 + j.rank * 1200;
  else if (j?.type === "finger") income = 2000 + j.rank * 3500;
  else if (j?.type === "heishou") income = 1500 + j.rank * 2500;
  else if (j?.type === "hhead") income = 15000 + Math.max(0, s.rep) * 40;
  else if (j?.type === "hlord") income = 50000;
  else if (j?.type === "sailor") income = 1200 + j.rank * 2000;
  else if (j?.type === "claw") income = 30000;
  else if (j?.type === "butler") income = 4000 + j.rank * 3000;
  if (income) { s.money += income; say(`${jobLabel(j)} 수입 ${fmt(income)}안.`, "act"); }
  if (s.age >= 18) {
    const cost = ({ nest: 5000, wing: 5000, back: 700, out: 250, spider: 0, hcorp: s.hFamily ? (s.job ? 3000 : 0) : 1200, sisyphe: 200 })[s.zone] + s.kids * (nestLike(s) ? 1500 : 300);
    s.money -= cost;
  }
  if (s.money < -3000) {
    hurt(rand(15, 35), "빚 수금업자에게 끌려가");
    s.money = -800;
    if (s.alive) say("빚쟁이들이 찾아왔다. 돈 대신 다른 것을 가져갔다.", "bad");
  }
  if (s.money >= 1000000) achieve("rich");
  // 자연 회복과 노화
  heal(s.age < 60 ? 18 : 10, 10);
  if (s.vampire && s.alive) {
    s.vampire.thirst++;
    if (s.vampire.thirst >= 2) { hurt(rand(15, 30), "피에 굶주려 말라 죽었다"); strain(rand(5, 10)); if (s.alive) say("피를 마시지 못한 몸이 안쪽부터 말라 간다.", "bad"); }
  }
  for (const n of s.relics || []) {
    if (!s.alive) break;
    const r = relicOf(n);
    if (!r.curse) continue;
    if (r.curse === "hp") hurt(rand(2, 6), `유물 「${n}」에 생명을 빼앗겨`); else strain(rand(2, 6), `유물 「${n}」에 잠식되어`);
  }
  if (s.age >= 60 && !s.vampire) { gain("fort", -1); hurt(rand(1, 3) + Math.floor((s.age - 60) / 8), "노쇠하여"); }
  if (s.ego && !s.ego.stable && s.alive) strain(rand(4, 10), "불안정한 E.G.O에 잠식되어");
  if (s.job?.type === "claw" && s.alive) strain(rand(3, 8), "발톱의 의무에");
  if (s.taboo && s.alive && chance(0.2)) {
    if (chance(0.03)) { s.taboo = 0; say("한밤중 붉은 빛줄기가 창밖을 지나쳤다. 이번엔 다른 사람을 찾아온 것이었다.", "bad"); }
    else die("머리의 발톱에게 처형당했다. 금기는 잊히지 않는다", true);
  }
  if (s.alive && !s.vampire && s.age >= 70 && chance((s.age - 67) * 0.015 + (s.zone === "back" ? 0.01 : 0))) {
    achieve("oldage");
    die("노환으로 잠든 채 세상을 떠났다. 이 도시에서 드문 죽음이다", true);
  }
}

function advanceYear() {
  if (!s || !s.alive || modalOpen) return;
  s.age++;
  s.ap = apFor(s);
  s.offer = null;
  s.last = null;
  yearEntry();
  passive();
  if (!s.alive) return finish();
  queue = milestones();
  if (s.nTaboo) queue.unshift({ run: nJudgment });
  if (s.age >= 4) {
    const n = s.age < 12 ? 1 : chance(0.55) ? 2 : 1;
    const used = new Set();
    for (let i = 0; i < n; i++) {
      const ev = weighted(EVENTS.filter(e => !used.has(e.id) && (s.zone !== "spider" || SPIDER_EVENTS.includes(e.id)) && (s.zone !== "sisyphe" ? !["broadcast", "peddler"].includes(e.id) : SISYPHE_EVENTS.includes(e.id))));
      if (ev) { used.add(ev.id); queue.push(ev); }
    }
  }
  processQueue();
}

function processQueue() {
  if (!s.alive) return finish();
  const ev = queue.shift();
  if (!ev) { save(); render(); return; }
  const res = ev.run();
  if (!res) return processQueue();
  if (res.choices || res.combat) {
    settle(res, text => { say(text, "event", res.title || res.combat.name); processQueue(); });
  } else {
    say(res.text, "event", res.title);
    processQueue();
  }
}

function doAction(a) {
  if (!s.alive || modalOpen) return;
  const cost = a.ap ?? 1;
  if (s.ap < cost) return;
  s.ap -= cost;
  if (cost) s.offer = null;
  yearEntry();
  settle(a.run(), text => { say(text, "act"); s.last = text; afterAction(); });
}
// 그해의 선택을 다 쓰면 저절로 한 해가 지나간다
function afterAction() {
  if (!s.alive) return finish();
  if (s.ap <= 0) return advanceYear();
  save(); render();
}

function finish() {
  modalOpen = false;
  $("#modalRoot").innerHTML = "";
  const graves = store.get(GRAVE_KEY) || [];
  graves.unshift({ name: s.name, gender: s.gender, age: s.age, where: where(s), job: jobLabel(s.bestJob), cause: s.cause });
  store.set(GRAVE_KEY, graves.slice(0, 12));
  store.del(SAVE_KEY);
  render();
}

// ───────── 렌더링 ─────────
function save() { if (s && s.alive) store.set(SAVE_KEY, s); }

function showChoice(res, done) {
  modalOpen = true;
  const opts = res.choices.filter(c => !c.cond || c.cond());
  $("#modalRoot").innerHTML = `
    <div class="modal-back" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal card">
        <div class="eyebrow">${s.age}세 · ${esc(where(s))}</div>
        <h3 id="mTitle">${esc(res.title)}</h3>
        <p>${esc(res.text)}</p>
        <div class="choices">${opts.map((c, i) => `<button class="btn" id="choice-${i}" data-i="${i}">${esc(c.label)}${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</button>`).join("")}</div>
      </div>
    </div>`;
  $("#modalRoot").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const c = opts[+b.dataset.i];
    modalOpen = false;
    $("#modalRoot").innerHTML = "";
    settle(c.run(), done);
  }));
  $("#choice-0")?.focus();
}

}

const PHRASE_SPIDER = { play: "실 사이에 숨어 혼자 논다", study: "몰래 숨겨 둔 책을 읽는다", train: "홀로 검을 휘두른다", rest: "방구석에서 숨을 고른다" };
const SPIDER_OK = ["sleep", "babble", "crawl", "toy", "play", "study", "train", "rest", "diary", "meditate", "shinLearn", "shinTrain", "egoCalm"];
// 놀이는 사는 곳에 따라 다르게 부른다
const PLAY_PLACE = { nest: "놀이터에서 뛰어논다", wing: "사내 어린이집 마당에서 뛰어논다", hcorp: "기와집 마당에서 뛰어논다", out: "폐허 사이를 뛰어다닌다" };
const phrase0 = a => (s.zone === "spider" && PHRASE_SPIDER[a.id]) || PHRASE[a.id] || a.label;
const phrase = a => (a.id === "play" && PLAY_PLACE[s.zone]) || phrase0(a);
const SISYPHE_OK = ["study", "train", "rest", "diary", "meditate", "shinLearn", "shinTrain", "egoCalm", "canned", "clerk", "climb", "cinema", "leaveSisyphe", "feed"];
const usable = a => a.cond() && !(a.block && a.block()) && (s.zone !== "spider" || SPIDER_OK.includes(a.id)) && (s.zone !== "sisyphe" || SISYPHE_OK.includes(a.id));

// 한 번에 최대 네 개의 선택지: 진로·일·생활에서 하나씩 우선, 나머지는 무작위
function makeOffer() {
  const ok = ACTIONS.filter(a => (a.ap ?? 1) > 0 && usable(a));
  const shuffled = list => list.map(a => [Math.random(), a]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const recent = s.recentOffer || [];
  const fresh = list => { const l = shuffled(list); return [...l.filter(a => !recent.includes(a.id)), ...l.filter(a => recent.includes(a.id))]; };
  const first = g => fresh(ok.filter(a => a.g === g))[0];
  // 목마른 혈귀에게는 피를 마시는 선택지가 반드시 뜬다
  const out = [ok.find(a => a.id === "feed" && s.vampire?.thirst >= 1), first("진로"), first("일"), chance(0.6) ? first("생활") : null]
    .filter((a, i, arr) => a && arr.indexOf(a) === i);
  for (const a of fresh(ok.filter(a => !out.includes(a)))) { if (out.length >= 4) break; out.push(a); }
  const ids = out.map(a => a.id);
  s.recentOffer = [...ids, ...recent].slice(0, 8);
  return ids;
}

function renderTurn() {
  if (!s.offer || !s.offer.length) { s.offer = makeOffer(); s.scene = pick(SCENES[s.zone] || SCENES.back); }
  const total = apFor(s);
  const season = (total === 1 ? ["한 해"] : total === 2 ? ["상반기", "하반기"] : ["봄", "여름", "가을"])[total - s.ap] || "한 해";
  const opts = s.offer.map(id => ACTIONS.find(a => a.id === id)).filter(a => a && usable(a));
  const tools = ACTIONS.filter(a => a.ap === 0 && a.cond() && s.zone !== "spider" && s.zone !== "sisyphe");
  return `
    <section class="panel card turn">
      <div class="panel-head"><h3>${s.age}세, ${season}</h3><span class="ap">남은 선택 <b>${s.ap}</b> / ${total}</span></div>
      ${s.last ? `<p class="last">${esc(s.last)}</p>` : ""}
      <p class="scene">${esc(s.scene || "")} 무엇을 할까?</p>
      <div class="choices">${opts.map(a => `<button class="btn opt" id="opt-${a.id}" data-id="${a.id}">${esc(phrase(a))}<small>${esc(a.desc)}</small></button>`).join("")}</div>
      <div class="tools">
        ${tools.map(a => { const b = a.block && a.block(); return `<button class="btn ghost opt" id="opt-${a.id}" data-id="${a.id}" ${b ? "disabled" : ""}>${esc(a.label)}<small>${esc(b || a.desc)}</small></button>`; }).join("")}
        <button class="btn ghost" id="skip">남은 시간을 흘려보낸다<small>${s.age + 1}세로 넘어간다</small></button>
      </div>
    </section>`;
}

function renderLog() {
  return s.log.slice().reverse().slice(0, 60).map(y => `
    <div class="year"><div class="age">${y.age}<small>세</small></div>

function render() {
  const top = $("#topActions");
  if (!s) { top.innerHTML = ""; return renderIntro(); }
  top.innerHTML = s.alive ? `<button class="btn ghost danger" id="restart">새 인생</button>` : "";
  $("#restart")?.addEventListener("click", confirmRestart);
  if (!s.alive) return renderEnding();
  $("#screen").innerHTML = `
    <div class="game">
      ${renderSheet()}
      <div class="main">
        ${renderTurn()}
        <section class="card">
          <div class="panel" style="padding-bottom:0"><div class="panel-head"><h3>연대기</h3><span class="ap">${esc(where(s))}</span></div></div>
          <div class="log">${renderLog()}</div>
        </section>
      </div>
    </div>`;
  $("#screen").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => doAction(ACTIONS.find(a => a.id === b.dataset.id))));
  $("#skip").addEventListener("click", () => { s.ap = 0; advanceYear(); });
}

function confirmRestart() {
  showChoice({ title: "새 인생을 시작할까", text: "지금의 삶은 기록되지 않고 사라진다.", choices: [
    { label: "다시 태어난다", run() { store.del(SAVE_KEY); s = null; render(); return null; } },
    { label: "계속 산다", run: () => null },
  ] }, () => { if (s) render(); });
}

function renderIntro() {
  const graves = store.get(GRAVE_KEY) || [];
  $("#screen").innerHTML = `
    <div class="intro">
      <section class="card">
        <div class="eyebrow">태어날 준비</div>
        <h2>도시에 태어난다는 것</h2>
        <p>머리가 금기를 정하고, 날개가 특이점으로 구를 먹여 살리고, 그 바깥 뒷골목에서는 새벽 3시 10분마다 청소부가 거리를 쓸어 간다.</p>
        <p>태어날 곳은 고를 수 없다. 해마다 눈앞에 놓인 선택지 가운데 하나를 고르고, 찾아오는 사건 앞에서 다시 선택하라. 해결사가 되어 색을 얻을 수도, 날개의 사원이 될 수도, 골목에서 이름 없이 사라질 수도 있다.</p>
        <div class="field">
          <label for="nameInput">이름</label>
          <div class="field-row">
            <input id="nameInput" maxlength="12" value="${esc(pick(NAMES))}">
            <button class="btn" id="randName">무작위</button>
          </div>
        </div>
        <div class="field">
          <label id="genderLabel">성별</label>
          <div class="seg" role="radiogroup" aria-labelledby="genderLabel">
            <label><input type="radio" name="gender" id="gender-m" value="m" checked>남성</label>
            <label><input type="radio" name="gender" id="gender-f" value="f">여성</label>
            <label><input type="radio" name="gender" id="gender-r" value="r">무작위</label>
          </div>
        </div>
        <button class="btn primary advance" id="born">태어난다</button>
      </section>
      <section class="card" style="padding:22px">
        <div class="eyebrow">지난 생의 묘비</div>
        <h2 style="font-size:22px">${graves.length ? "먼저 간 사람들" : "아직 묘비가 없다"}</h2>
        <div class="graves">${graves.length ? graves.map(g => `<div class="grave"><b>${esc(g.name)}</b> · ${GENDERS[g.gender] ? GENDERS[g.gender] + " · " : ""}${g.age}세 · ${esc(g.job)}<span>${esc(g.where)} — ${esc(g.cause)}</span></div>`).join("")
          : `<p>한 생을 마치면 여기에 이름이 남는다. 도시에서 묘비를 가진다는 것만으로도 운이 좋은 편이다.</p>
             <div class="grave"><b>예시) 로웰</b> · 34세 · 4급 해결사<span>14구 뒷골목 — 조직 소탕 의뢰에 실패하여</span></div>`}</div>
      </section>
    </div>`;
  $("#randName").addEventListener("click", () => { $("#nameInput").value = pick(NAMES); });
  $("#born").addEventListener("click", () => {
    s = newLife($("#nameInput").value.trim(), document.querySelector('input[name="gender"]:checked')?.value);
    s.ap = apFor(s);
    const kid = gx("아들", "딸");
    const birth = {
      nest: `${where(s)}에서 ${kid}로 태어났다. 날개의 보호 아래, 비교적 운이 좋은 출발이다.`,
      hcorp: s.hFamily ? `H사 ${s.hFamily}에서 ${kid}로 태어났다. 수많은 형제 가운데 하나. 가주의 자리는 하나뿐이다.` : `${where(s)}의 평범한 집에서 ${kid}로 태어났다. 기와지붕 위로 날개의 깃발이 펄럭인다.`,
      wing: `${s.wingCo} 직원 가정의 ${kid}로 태어났다. ${WINGS.find(w => w.co === s.wingCo)?.flavor ?? ""} 출입증이 있는 아기다.`,
      back: `${where(s)}에서 ${kid}로 태어났다. 뒷골목의 낡은 방 한 칸. 흔한 시작이다.`,
      out: `${where(s)}에서 ${kid}로 태어났다. 도시 바깥, 외곽의 폐허 가장자리. 살아남은 것만으로 대단하다.`,
      spider: `다섯 손가락이 자신들의 치부를 버리는 곳, 거미집에서 ${kid}로 태어났다. 어머니 시오미 요루는 갓난아기에게 처음이자 마지막 한마디를 건넸다. "날 닮지 마라."`,
    }[s.zone];
    say(birth, "event", "탄생");
    if (s.birthStar) say(s.birthStar.tier === "tiangang" ? "태어난 날 밤, 하늘 높이 별 하나가 유난히 밝게 빛났다." : "태어난 날 밤, 땅 가까이 낮게 뜬 별 하나가 오래 지지 않았다.", "event", "별");
    save(); render();
  });
}

function renderEnding() {
  const ep = s.age < 12 ? "너무 일찍 꺼진 등불." : s.vampire ? `${BLOOD_RANKS[s.vampire.rank]}${hasBatchim(BLOOD_RANKS[s.vampire.rank]) ? "으로" : "로"} ${s.age}년을 살았다. 그동안 마신 피는 기억하지 않는다.` : (s.relics || []).length >= 3 ? "유물들은 주인을 잃고 다시 누군가의 손을 기다린다." : s.zone === "sisyphe" ? "시지프 백화점의 계단을 끝내 다 오르지 못했다." : s.ach.includes("sisypheOut") ? "백화점의 옥상에서 다시 도시로 걸어 나온 사람이었다." : s.araya === "lost" ? "끝내 알아보지 못한 붉은 리본이 있었다." : s.ach.includes("lord") ? "H사의 모든 가문이 그 이름 앞에 고개를 숙였다." : s.ach.includes("claw") ? "머리의 발톱으로 살았다. 그 이름은 어떤 기록에도 남지 않는다." : s.araya === "with" ? `아라야는 끝까지 ${gx("아버지", "어머니")}의 손을 놓지 않았다.` : s.araya === "vault" ? "금고 속의 약속은 끝내 지켜지지 않았다." : s.ach.includes("mang5") ? "다섯 겹의 빛의 고리를 두른 사람이 있었다고, 골목은 오래 이야기했다." : s.ego?.stable ? `${gx("그", "그녀")}의 마음은 끝내 「${s.ego.name}」(으)로 피어났다.` : s.ach.includes("color") ? "도시는 그 색을 오래 기억할 것이다." : s.ach.includes("oldage") ? "끝까지 살아남았다. 그것이 이 도시에서 가장 어려운 일이다." : s.kids ? `${s.kids}명의 아이가 그 이름을 이어 간다.` : "이름은 곧 골목의 소음에 묻힐 것이다.";
  $("#screen").innerHTML = `
    <div class="game">
      ${renderSheet()}
      <div class="main">
        <section class="ending card">
          <div class="eyebrow">생애 종료</div>
          <h2>${esc(s.name)}, ${s.age}세</h2>
          <p class="epitaph">${esc(s.cause)}.<br>${esc(ep)}</p>
          <dl class="kv" style="max-width:360px">
            <dt>최고 경력</dt><dd>${esc(jobLabel(s.bestJob))}</dd>
            <dt>남긴 돈</dt><dd class="money">${fmt(s.money)}안</dd>
            <dt>업적</dt><dd>${s.ach.length}개</dd>
          </dl>
          <button class="btn primary advance" id="again">다시 태어난다</button>
        </section>
        <section class="card"><div class="panel" style="padding-bottom:0"><div class="panel-head"><h3>연대기</h3></div></div><div class="log">${renderLog()}</div></section>
      </div>
    </div>`;
  $("#again").addEventListener("click", () => { s = null; render(); });
}

// ───────── 시작 ─────────
function start(hot) {
  s = (hot && hot.s) || store.get(SAVE_KEY);
  if (s && !s.alive) s = null;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ s }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
