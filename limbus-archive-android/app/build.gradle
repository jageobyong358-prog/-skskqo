plugins {
    id "com.android.application"
}

android {
    namespace "io.github.jageobyong358.limbusarchive"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.jageobyong358.limbusarchive"
        minSdk 24
        targetSdk 35
        // Follows the upstream release this wrapper was made from (Schirke/limbus-archive v0.12.17)
        versionCode 1218
        versionName "0.12.17.1"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // texture2ddecoder (ASTC, ETC2, BC7, crunch…) for the Files page
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        // A fixed key kept in the repo so that each new APK installs over the previous one.
        // It is not a secret: anyone with this repo can sign as this app. Fine for a personal sideload.
        release {
            storeFile file("limbus-archive.keystore")
            storePassword "limbusarchive"
            keyAlias "limbusarchive"
            keyPassword "limbusarchive"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // the game type trees are gzipped already
    androidResources {
        noCompress "gz"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // LZMA for LZMA-compressed asset bundles
    implementation "org.tukaani:xz:1.10"
}
